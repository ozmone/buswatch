<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>BUS WATCH diagnostics</title><style>body{font:16px system-ui;background:#0b1110;color:#f2f5ed;max-width:800px;margin:40px auto;padding:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}a{color:#d0f780}</style></head><body><h1>Browser feed diagnostics</h1><p>This page tests direct browser access to the two official feeds and checks PWA support. A failed direct request with a working same-origin API confirms why the Worker is needed.</p><pre id="result">Testing…</pre><a href="/">Back to BUS WATCH</a><script type="module">

}

</script></body></html>
